name: noor_al_quran
description: تطبيق نور القرآن - القرآن الكريم والأذكار والأدعية ومواقيت الصلاة والقبلة.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # القرآن والصوت
  just_audio: ^0.10.6

  # الشبكة
  http: ^1.5.0

  # التخزين المحلي
  shared_preferences: ^2.5.5

  # مسارات الملفات
  path_provider: ^2.1.5

  # المشاركة
  share_plus: ^12.0.2

  # النطق الصوتي
  flutter_tts: ^4.2.5

  # الموقع والقبلة
  geolocator: ^14.0.2
  flutter_compass: ^0.8.1

  # الأذكار
  adhkar: ^0.0.1

  # المصحف داخل WebView
  webview_flutter: ^4.14.1
  webview_flutter_web: ^0.2.3+4
  webview_flutter_platform_interface: ^2.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
