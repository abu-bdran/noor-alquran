name: Build Noor Al Quran APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android platform files
        run: flutter create . --platforms=android --project-name=noor_al_quran

      - name: Configure Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]

          marker = '<application'

          missing = [p for p in permissions if p not in text]

          if missing:
              insertion = "\n".join(missing) + "\n\n"
              text = text.replace(marker, insertion + marker, 1)
              manifest.write_text(text, encoding="utf-8")

          print(manifest.read_text(encoding="utf-8"))
          PY

      - name: Get packages
        run: flutter pub get

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-quran-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
